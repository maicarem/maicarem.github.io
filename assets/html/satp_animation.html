    ctx.strokeStyle = alpha(colorOf(tr.name), 0.6); ctx.beginPath();
    for (const l of tr.legs) {
      if (t <= l.t0) break;
      const u = Math.min(1, (t - l.t0) / ((l.t1 - l.t0) || 1));
      ctx.moveTo(...toC(...l.p0)); ctx.lineTo(...toC(...lerp(l.p0, l.p1, u)));
    }
    ctx.stroke();
  }
  // service areas
  const done = {}, serving = {};
  for (const op of s.ops) for (const a of s.acts[op.name] || []) if (a.kind === 'service') {
    const id = baseId(a.node);
    if (t >= a.t1) done[id] = opColor(op); else if (t >= a.t0) serving[id] = { c: opColor(op), u: (t - a.t0) / (a.t1 - a.t0) };
  }
  DATA.nodes.forEach((v, i) => {
    const k = smooth(appear * DATA.nodes.length - i); if (k <= 0) return;
    const [x, y] = toC(v.x, v.y), r = 34 * (0.6 + 0.4 * k);
    ctx.globalAlpha = k;
    const c = done[v.id] || (serving[v.id] && serving[v.id].c);
    circle(x, y, r); ctx.fillStyle = c ? alpha(c, done[v.id] ? 0.22 : 0.12) : theme.panel; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = c ? alpha(c, 0.9) : theme.muted; ctx.stroke();
    if (serving[v.id]) {
      ctx.beginPath(); ctx.arc(x, y, r + 8, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * serving[v.id].u);
      ctx.lineWidth = 6; ctx.strokeStyle = serving[v.id].c; ctx.stroke();
    }
    if (done[v.id]) {
      ctx.beginPath(); ctx.moveTo(x - 10, y + 1); ctx.lineTo(x - 2, y + 9); ctx.lineTo(x + 12, y - 9);
      ctx.lineWidth = 4; ctx.strokeStyle = done[v.id]; ctx.stroke();
    }
    font(600, 18 * FS); ctx.fillStyle = theme.muted; ctx.textAlign = 'center';
    ctx.fillText(`Area ${v.area}`, x, y + r + 20 + 14 * FS);
    ctx.globalAlpha = 1;
  });
  // depot
  const [dx, dy] = toC(depot.x, depot.y);
  ctx.globalAlpha = smooth(appear * 2);
  ctx.beginPath(); ctx.roundRect(dx - 34, dy - 30, 68, 60, 10); ctx.fillStyle = theme.panel; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = theme.muted; ctx.stroke();
  font(600, 18 * FS); ctx.fillStyle = theme.muted; ctx.textAlign = 'center'; ctx.fillText('Depot', dx, dy + 44 + 14 * FS);
  ctx.globalAlpha = 1;
}

function drawFocus(sc, t) {
  const f = sc.focus; if (!f) return;
  const k = Math.exp(-(((t - f.t) / (1.8 * f.w)) ** 2)); if (k < 0.02) return;
  const pa = posOf(sc.s, f.a, t), pb = posOf(sc.s, f.b, t);
  const dist = Math.hypot(pa[0] - pb[0], pa[1] - pb[1]) / SC, bad = dist < d - 1e-6, c = bad ? RED : GREEN;
  for (const p of [pa, pb]) {
    circle(p[0], p[1], d * SC); ctx.fillStyle = alpha(c, 0.13 * k); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = alpha(c, 0.8 * k); ctx.stroke();
  }
  ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(...pa); ctx.lineTo(...pb);
  ctx.lineWidth = 2; ctx.strokeStyle = alpha(c, k); ctx.stroke(); ctx.setLineDash([]);
  font(700, 20 * FS); ctx.textAlign = 'left'; ctx.fillStyle = alpha(c, k);
  const mx = Math.max(pa[0], pb[0]) + d * SC + 14, my = Math.min(pa[1], pb[1]) - d * SC - 10;
  ctx.fillText(`gap ${dist.toFixed(1)} ${bad ? '<' : '≥'} d = ${d}`, mx, my);
}

function drawCrashFlash(sc) {
  if (!sc.freeze || frozen <= 0) return;
  const [x, y] = toC(...sc.freeze.pos), e = FREEZE - frozen;
  for (let i = 0; i < 3; i++) {
    const ph = ((e * 0.9 + i / 3) % 1);
    circle(x, y, 20 + ph * 120); ctx.lineWidth = 4 * (1 - ph); ctx.strokeStyle = alpha(RED, 1 - ph); ctx.stroke();
  }
}

function drawTruck(s, tr, t) {
  const c = truckC(s, tr, t), col = colorOf(tr.name), key = tr.name;
  let a = heading[key] ?? c.a, diff = Math.atan2(Math.sin(c.a - a), Math.cos(c.a - a));
  heading[key] = a = a + diff * 0.18;
  ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(a); ctx.scale(ICON, ICON);
  ctx.shadowColor = col; ctx.shadowBlur = c.moving ? 24 : 10;
  ctx.beginPath(); ctx.roundRect(-26, -15, 40, 30, 6); ctx.fillStyle = col; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.roundRect(16, -13, 14, 26, 5); ctx.fillStyle = col; ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(22, -10, 5, 20);
  ctx.restore();
  font(700, 17 * FS); ctx.textAlign = 'center'; ctx.fillStyle = theme.fg; ctx.fillText(tr.name, c.x, c.y - 26 * ICON - 6);
}

function drawOperator(s, op, t) {
  const { p, serving } = opC(s, op, t), col = opColor(op);
  if (serving) { const ph = (t * 1.5) % 1; circle(p[0], p[1], 10 + 14 * ph); ctx.strokeStyle = alpha(col, 1 - ph); ctx.lineWidth = 2; ctx.stroke(); }
  circle(p[0], p[1], 9 * ICON); ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = col; ctx.stroke();
  circle(p[0], p[1], 6 * ICON); ctx.fillStyle = col; ctx.fill();
}

// panel layout: ?embed drops the header (the host page has its own) and enlarges text for narrow columns
const EMBED = params.has('embed'), FS = EMBED ? 1.7 : 1;
const LAY = EMBED ? { chip: 40, text: 165, lh: 50, stats: 290, gantt: 520, rh: 44, legend: 770 }
                  : { chip: 222, text: 300, lh: 32, stats: 418, gantt: 540, rh: 30, legend: 800 };
function drawPanel(sc, t, fadeIn) {
  const x = 1000, w = 540;
  ctx.textAlign = 'left';
  if (!EMBED) {
    font(700, 16); ctx.fillStyle = theme.muted; ctx.fillText('PHD RESEARCH  ·  MULTI-AGENT SCHEDULING', x, 84);
    font(750, 40); ctx.fillStyle = theme.fg; ctx.fillText('Coordinating trucks', x, 136); ctx.fillText('and service operators', x, 184);
  }
  // chip + text (switches to the conflict message while frozen)
  const conflict = sc.freeze && frozen > 0;
  const chip = conflict ? 'Conflict detected' : sc.chip, color = conflict ? RED : sc.color;
  const text = conflict ? `The optimal plan sends ${crash.a} and ${crash.b} through the same spot: they come ${crash.min_distance.toFixed(1)} apart, below the safety distance d\u00a0=\u00a0${d}.` : sc.text;
  const shown = !EMBED ? text : conflict ? `${crash.a} and ${crash.b} come ${crash.min_distance.toFixed(1)} apart, below d\u00a0=\u00a0${d}.` : sc.short;
  ctx.globalAlpha = fadeIn;
  let cf = 19 * FS; font(700, cf);
  while (ctx.measureText(chip).width + 32 * FS > w && cf > 12) font(700, --cf);
  const cw = ctx.measureText(chip).width + 32 * FS, ch = 38 * FS;
  ctx.beginPath(); ctx.roundRect(x, LAY.chip, cw, ch, ch / 2); ctx.fillStyle = alpha(color, 0.16); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = alpha(color, 0.7); ctx.stroke();
  ctx.fillStyle = color; ctx.fillText(chip, x + 16 * FS, LAY.chip + 26 * FS);
  font(400, 22 * FS); ctx.fillStyle = theme.fg; wrap(shown, x, LAY.text, w, LAY.lh);
  ctx.globalAlpha = 1;
  // stat tiles
  const s = sc.s, nCrash = sc.type === 'intro' ? '–' : String(s === P1 && t < (crash ? crash.t_min : Infinity) ? 0 : s.crashes.length);
  const tiles = [['time', sc.type === 'intro' ? '–' : t.toFixed(1)],
                 ['makespan', sc.type === 'intro' ? '–' : (t >= s.makespan - 1e-9 ? s.makespan.toFixed(1) : '…')],
                 ['conflicts', nCrash]];
  tiles.forEach(([lab, val], i) => {
    const tx = x + i * 182, ty = LAY.stats;
    ctx.beginPath(); ctx.roundRect(tx, ty, 168, 84 * FS, 12); ctx.fillStyle = theme.panel; ctx.fill();
    font(600, (EMBED ? 12 : 15) * FS); ctx.fillStyle = theme.muted; ctx.fillText(lab.toUpperCase(), tx + 16, ty + 28 * FS);
    font(700, 32 * FS); ctx.fillStyle = lab === 'conflicts' && val !== '0' && val !== '–' ? RED : theme.fg; ctx.fillText(val, tx + 16, ty + 70 * FS);
  });
  if (sc.type === 'outro') drawCompare(x, w); else drawGantt(sc, t, x, w);
  drawLegend(x, w);
}

function ganttRows(s) {
  const rows = [];
  for (const tr of s.trucks) { rows.push(tr); for (const op of s.ops) if (op.legs[0].carrier === num(tr.name)) rows.push(op); }
  for (const op of s.ops) if (!rows.includes(op)) rows.push(op);
  return rows;
}
function drawGantt(sc, t, x, w) {
  const s = sc.s, rows = ganttRows(s), top = LAY.gantt, rh = Math.min(LAY.rh, (6 * LAY.rh) / rows.length), lx = x + 44 * FS, gw = w - 44 * FS;
  const X = v => lx + (v / Tmax) * gw;
  font(600, 15 * FS); ctx.fillStyle = theme.muted; ctx.fillText('SCHEDULE', x, top - 14);
  rows.forEach((a, r) => {
    const y = top + r * rh, isT = a.name[0] === 'T', col = isT ? colorOf(a.name) : opColor(a);
    font(600, 15 * FS); ctx.fillStyle = theme.muted; ctx.fillText(a.name, x, y + rh * 0.68);
    ctx.fillStyle = theme.panel; ctx.fillRect(lx, y + 3, gw, rh - 6);
    const blocks = isT ? a.legs.map(l => [l.t0, l.t1, 1])
      : [...a.legs.map(l => [l.t0, l.t1, 0.35]), ...(s.acts[a.name] || []).filter(q => q.kind === 'service').map(q => [q.t0, q.t1, 1])];
    for (const [b0, b1, op] of blocks) {
      ctx.fillStyle = alpha(col, 0.15 * op); ctx.fillRect(X(b0), y + 5, X(b1) - X(b0), rh - 10);
      if (t > b0) { ctx.fillStyle = alpha(col, 0.95 * op); ctx.fillRect(X(b0), y + 5, X(Math.min(t, b1)) - X(b0), rh - 10); }
    }
  });
  const bottom = top + rows.length * rh;
  if (s === P1 && crash && t >= crash.t_min) {
    ctx.strokeStyle = RED; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(crash.t_min), top); ctx.lineTo(X(crash.t_min), bottom); ctx.stroke();
  }
  if (t >= s.makespan - 1e-9) {
    ctx.setLineDash([4, 4]); ctx.strokeStyle = theme.fg; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(X(s.makespan), top - 4); ctx.lineTo(X(s.makespan), bottom + 4); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = theme.fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(t), top - 6); ctx.lineTo(X(t), bottom + 6); ctx.stroke();
}
function drawCompare(x, w) {
  const top = LAY.gantt, bh = 28 * FS, k = smooth(st / 1.2);
  font(600, 15 * FS); ctx.fillStyle = theme.muted; ctx.fillText('MAKESPAN', x, top - 14);
  [[P1, 'Phase 1', RED], [P2, 'Phase 2a', GREEN]].forEach(([s, lab, col], i) => {
    const y = top + i * (26 * FS + bh + 8), bw = w * (s.makespan / Tmax) * k;
    font(600, 18 * FS); ctx.fillStyle = theme.fg; ctx.fillText(lab, x, y + 18 * FS);
    ctx.fillStyle = theme.panel; ctx.fillRect(x, y + 26 * FS, w, bh);
    ctx.fillStyle = alpha(col, 0.85); ctx.fillRect(x, y + 26 * FS, bw, bh);
    font(700, 17 * FS); ctx.fillStyle = '#ffffff'; ctx.textAlign = 'right';
    ctx.fillText(`${s.makespan.toFixed(1)}  ${s.crashes.length ? '✕ unsafe' : '✓ safe'}`, x + bw - 12, y + 26 * FS + bh * 0.7);
    ctx.textAlign = 'left';
  });
}
function drawLegend(x, w) {
  const icons = {
    truck: (ix, iy) => { ctx.beginPath(); ctx.roundRect(ix - 13, iy - 9, 26, 18, 4); ctx.fillStyle = PALETTE[0]; ctx.fill(); },
    operator: (ix, iy) => { circle(ix, iy, 8); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = PALETTE[0]; ctx.stroke();
                            circle(ix, iy, 5); ctx.fillStyle = PALETTE[0]; ctx.fill(); },
    'service area': (ix, iy) => { circle(ix, iy, 10); ctx.lineWidth = 2; ctx.strokeStyle = theme.muted; ctx.stroke(); },
    'safety radius d': (ix, iy) => { circle(ix, iy, 10); ctx.fillStyle = alpha(GREEN, 0.15); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = GREEN; ctx.stroke(); },
  };
  font(500, 16 * FS); ctx.textAlign = 'left';
  let cx = x, cy = LAY.legend;
  for (const [label, draw] of Object.entries(icons)) {
    const iw = 34 + ctx.measureText(label).width + 28;
    if (cx + iw - 28 > x + w) { cx = x; cy += 44 * FS; }
    draw(cx + 13, cy - 5 * FS); ctx.fillStyle = theme.muted; ctx.fillText(label, cx + 34, cy);
    cx += iw;
  }
}

function render() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  const sc = SCENES[si], t = sceneTime(), fadeIn = smooth(st / 0.5);
  drawBackground();
  drawMap(sc.s, t, sc.type === 'intro' ? smooth(st / 2) : 1);
  if (sc.type !== 'intro' || st > 1.6) {
    ctx.globalAlpha = sc.type === 'intro' ? smooth((st - 1.6) / 0.6) : 1;
    if (sc.type === 'play') drawFocus(sc, t);
    for (const tr of sc.s.trucks) drawTruck(sc.s, tr, t);
    for (const op of sc.s.ops) drawOperator(sc.s, op, t);
    ctx.globalAlpha = 1;
  }
  if (sc.type === 'play') drawCrashFlash(sc);
  drawPanel(sc, t, fadeIn);
  if (st < 0.35) { ctx.fillStyle = theme.bg; ctx.globalAlpha = 1 - st / 0.35; ctx.fillRect(0, 0, 960, H); ctx.globalAlpha = 1; }
}

let last = null;
function frame(now) {
  const dt = last === null ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused && visible) update(dt);
  render();
  requestAnimationFrame(frame);
}
const setPaused = p => { paused = p; btn.innerHTML = p ? '&#9654;' : '&#10074;&#10074;'; btn.setAttribute('aria-label', p ? 'Play' : 'Pause'); };
btn.onclick = cv.onclick = () => setPaused(!paused);
new IntersectionObserver(es => { visible = es[0].isIntersecting; }).observe(cv);
window.addEventListener('resize', resize);
matchMedia('(prefers-reduced-motion: reduce)').matches && setPaused(true);
if (params.get('scene')) { startScene(+params.get('scene')); st = +(params.get('st') || 0); tm = +(params.get('t') || 0); if (params.get('frozen')) { froze = true; frozen = +params.get('frozen'); } setPaused(params.has('still')); }
readTheme(); resize(); requestAnimationFrame(frame);
})();
</script>
